    :root {
      --accent: #c9a7ff;
      --text: #f0e6ff;
      --muted: #b9a2dc;
      --font: "BFC Charmed Witches", "Berkshire Swash", Georgia, serif;

    * {

      font-family: var(--font);
      font-size: 16px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 36px 18px calc(16px + env(safe-area-inset-bottom));
    }

    .logo {
      max-width: 180px;
      width: 55%;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    .profile {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
      background: #2a1650;
      font-size: 0;
      color: transparent;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 1.7rem;
      letter-spacing: 2px;
      margin: 18px 0 0;
    }

    .tagline {
      letter-spacing: 1.5px;
      font-size: .95rem;
      color: var(--muted);
      margin: 14px 0 24px;
    }

    .icons {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-bottom: 22px;
      -webkit-user-select: none;
      user-select: none;
    }

    .icons a {
      flex: 0 1 46px;
      min-width: 0;
      height: 46px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s, transform .15s;
    }

    .icons a:hover,
    .icons a:active {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .icons svg {
      width: 26px;
      max-width: 62%;
      height: auto;
      aspect-ratio: 1 / 1;
      fill: currentColor;
      display: block;
    }

    a.link {
      display: block;
      margin: 0 0 11px;
      padding: 13px 14px;
      min-height: 50px;
      line-height: 1.3;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      text-decoration: none;
      font-family: var(--font);
      font-size: 1.1rem;
      transition: background .15s, color .15s, transform .15s;
    }

    a.link:hover,
    a.link:active {
      background: var(--accent);
      color: #1a0f2e;
      transform: translateY(-1px);
    }

    .footer {
      font-family: var(--font-plain);
      font-size: .70rem;
      line-height: 1.4;
      color: var(--muted);
      margin: 10px 0 0;
      padding: 0;
    }

    @media (max-width: 480px) {
      .wrap {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
